<!doctype html>
<html lang="sk">
<head>
<script src="/style/vzhlad.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stránka nenájdená: SEPA pain.001 Generátor</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="./favicon.ico" />
<!-- Vzhľad: jediný zdroj je /style/paper.css (Paper v2), fonty ARLing sú hostené u nás, žiadne externé CDN. -->
<link rel="preload" href="/fonts/arling-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/arling-serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style/paper.css">
<script src="/style/prepinac.js" defer></script>
<noscript><style>.r{opacity:1 !important;transform:none !important;filter:none !important}</style></noscript>
<style>
  /* Len to, čo paper.css nerieši: jedna stredová karta na celú výšku obrazovky. */
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 0; }
  main { width:var(--wrap); max-width:560px; text-align:center; }
  .lock { display:flex; align-items:center; justify-content:center; gap:11px; margin:0 0 clamp(20px,3vw,32px); flex-wrap:wrap; }
  .lock svg { display:block; flex:none; }
  .lock b { font:600 21px/1 var(--display); color:var(--ink); letter-spacing:-.01em; }
  .lock span { font-family:var(--ui); font-size:13px; color:var(--muted); border-left:1px solid var(--line); padding-left:11px; }
  h1 { margin:0 0 14px; }
  .sub { color:var(--body); margin:0 auto clamp(24px,3vw,32px); max-width:44ch; }
  code { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
  @media (max-width:420px) { .lock span { border-left:none; padding-left:0; } }
</style>
</head>
<body>
<div class="wash" aria-hidden="true"><i></i><i></i></div>

<main id="card">
  <p class="lock r">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><defs><path id="m" fill-rule="evenodd" d="M16 2.5 L29 29.5 H3 Z M16 12.4 L22.4 25.6 H9.6 Z"/><clipPath id="mr"><rect x="16" width="16" height="32"/></clipPath></defs><use href="#m" fill="#141413"/><use href="#m" fill="#b23a1d" clip-path="url(#mr)"/></svg>
    <b>ARLing</b><span>SEPA pain.001 Generátor</span>
  </p>
  <h1 class="r d1">Táto stránka neexistuje.</h1>
  <p class="sub r d2">Aj banka by tento odkaz odmietla. Vráťte sa a namiesto neho si vygenerujte svoj <code>pain.001</code> XML z Excelu.</p>
  <p class="r d3" style="margin:0"><a class="btn btn-solid" href="./" data-umami-event="404_back">Späť na SEPA pain.001 Generátor</a></p>
</main>

<script>
// Jeden pokojný príchod. prefers-reduced-motion vypína všetko, žiadna knižnica.
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('card').classList.add('in');
});
</script>
</body>
</html>
